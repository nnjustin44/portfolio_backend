# OpenAI API configuration - direct env var reference only (no cycles or uppercase defs)
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.key=${OPENAI_API_KEY}
quarkus.http.cors=true
quarkus.http.cors.origins=https://justinnguyen.us/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,content-type
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

